[PHP]
engine = On
extension_dir = "ext"
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=fileinfo
extension=curl
extension=zip
extension=gd
extension=intl
extension=exif

memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = UTC
